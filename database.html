<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Lokal - Bubur Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-database text-primary"></i> Panel Database Lokal (Storage)</h2>
        <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Kembali ke Menu Utama</a>
    </div>

    <div class="row">
        <div class="col-md-12 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Kontrol Database</h5>
                    <p class="text-muted small">Data di bawah ini disimpan secara lokal di browser (`localStorage`) sehingga kompatibel di server lokal maupun statis seperti GitHub Pages/GitLab Pages.</p>
                    <button class="btn btn-danger btn-sm" onclick="resetDatabase()"><i class="fas fa-trash"></i> Reset / Kosongkan Database</button>
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Data Mentah (JSON Format)</h5>
                    <pre id="dbViewer" class="bg-dark text-white p-3 rounded" style="max-height: 400px; overflow: auto;"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function loadDBData() {
        let dbData = {
            status_kasir: localStorage.getItem('db_kasir'),
            orders: JSON.parse(localStorage.getItem('db_orders') || '[]')
        };
        document.getElementById('dbViewer').innerText = JSON.stringify(dbData, null, 4);
    }

    function resetDatabase() {
        if(confirm('Yakin ingin mereset seluruh database lokal?')) {
            localStorage.clear();
            localStorage.setItem('db_orders', JSON.stringify([]));
            localStorage.setItem('db_kasir', 'TUTUP');
            loadDBData();
            alert('Database berhasil direset.');
        }
    }

    window.onload = loadDBData;
</script>

</body>
</html>
